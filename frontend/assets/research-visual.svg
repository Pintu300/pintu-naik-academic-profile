<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Computer science research visual</title>
  <desc id="desc">Abstract code blocks, graph nodes, and system layers for an academic website hero.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#253244"/>
      <stop offset="0.52" stop-color="#2f4b50"/>
      <stop offset="1" stop-color="#d9b46f"/>
