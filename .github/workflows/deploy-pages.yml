name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Isolated CI service only; never use trust authentication for production.
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Check JavaScript
        run: npm run check

      - name: Check for exposed credentials and private files
        run: npm run security:history

      - name: Run regression tests
        run: npm test

      - name: Check database initialization and migrations
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          npm run db:init
          npm run db:check

      - name: Set up Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        with:
          firefox-version: latest

      - name: Set up geckodriver
        uses: browser-actions/setup-geckodriver@78df1e66d20b8af6da82099a570868d171e5ad18
        with:
          geckodriver-version: latest
          token: ${{ github.token }}

      - name: Run browser regression tests
        timeout-minutes: 10
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: npm run test:browser

      - name: Keep browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-review
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build static website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          # Preserve the build-generated .nojekyll marker inside dist.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
