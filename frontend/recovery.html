<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' https://www.google-analytics.com https://*.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://pintu-naik-visitor-stats.pintunaik300.workers.dev; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Recover Admin Access | Personal Website</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="editor-page login-page" aria-labelledby="recovery-title">
      <header class="editor-header">
        <a class="text-link" href="login.html">← Back to sign in</a>
        <h1 id="recovery-title">Recover admin access</h1>
        <p>Use your registered recovery email to reset your password and recover your username.</p>
      </header>
      <form class="editor-form editor-card" data-recovery-form method="post" action="/api/auth/recovery/reset">
        <label>Recovery email
          <input name="email" type="email" autocomplete="email" maxlength="254" required />
        </label>
        <button class="button neutral" type="button" data-request-code>Send recovery code</button>
        <label>8-digit recovery code
          <input name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" minlength="8" maxlength="8" required />
        </label>
        <label>New password
          <input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required />
        </label>
        <label>Confirm new password
          <input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required />
        </label>
        <p>Codes expire after 10 minutes and work once. Requesting another code replaces the previous code.</p>
        <button class="button primary" type="submit">Reset password</button>
        <p class="editor-status" data-recovery-status role="status" aria-live="polite"></p>
        <a class="text-link" href="login.html" data-recovery-login hidden>Sign in with your new password</a>
        <noscript>Enable JavaScript to recover your admin account.</noscript>
      </form>
    </main>
    <script src="recovery.js"></script>
  </body>
</html>
